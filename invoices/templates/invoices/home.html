<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // Shrink the page on small screens so it always fits the width
  var wrap = document.getElementById("wrap");
  var zoom = 1; // 1 = fits the screen, bigger = zoomed in
  var page = document.getElementById("page");
  function fit() {
    // Fit both width and height, so the page never needs scrolling
    var w = document.body.clientWidth - 16;
    var h = document.body.clientHeight - 16;
    var s = Math.min(w / 1500, h / 1714) * zoom;
    var sx = s; // same scale in both directions, so nothing looks stretched
    page.style.transform = "scale(" + sx + "," + s + ")";
    wrap.style.width = 1500 * sx + "px";
    wrap.style.height = 1714 * s + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  document.getElementById("zoom-in").addEventListener("click", function () {
    zoom = Math.min(zoom * 1.25, 3);
    fit();
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    zoom = Math.max(zoom / 1.25, 1); // never smaller than "fits the screen"
    fit();
  });

  // Fill "قیمت کل" of every row and the grand total while the user types
  function calculate() {
    var grandTotal = 0;
    var rows = document.querySelectorAll("#tbl tr");

    rows.forEach(function (row) {
      var price = row.querySelector('[name="price"]');
      if (!price) return; // header row and the last empty row have no inputs

      var quantity = Number(row.querySelector('[name="quantity"]').value);
      var discount = Number(row.querySelector('[name="discount"]').value);

      var amount = quantity * Number(price.value);
      amount = Math.floor(amount * (1 - discount / 100));

      row.cells[5].textContent = amount ? amount.toLocaleString("fa-IR") : "";
      grandTotal += amount;
    });

    var totalBox = document.querySelector("#total .value");
    totalBox.textContent = grandTotal ? grandTotal.toLocaleString("fa-IR") : "";
  }
  document.getElementById("tbl").addEventListener("input", calculate);
  // ---------- Download button: save in Django, then download a PDF ----------
  var btn = document.getElementById("save-btn");
  var msg = document.getElementById("msg");

  function downloadPdf(invoiceId) {
    return html2canvas(page, {
      scale: 2,
      windowWidth: 1500,
      windowHeight: 1714,
      onclone: function (clonedDoc) {
        // in the copy, show the page at its real size (no shrinking)
        clonedDoc.getElementById("page").style.transform = "none";
        clonedDoc.getElementById("wrap").style.width = "1500px";
        clonedDoc.getElementById("wrap").style.height = "1714px";
      }
    }).then(function (canvas) {
      var pdf = new window.jspdf.jsPDF({ unit: "px", format: [1500, 1714] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, 1500, 1714);
      pdf.save("invoice-" + invoiceId + ".pdf");
    });
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    msg.textContent = "در حال ذخیره...";

    // 1) collect the values of the table
    var data = new FormData();
    data.append("csrfmiddlewaretoken", document.querySelector("[name=csrfmiddlewaretoken]").value);
    document.querySelectorAll("#tbl input").forEach(function (input) {
      data.append(input.name, input.value);
    });

    // 2) send them to the Django view
    fetch(window.location.href, { method: "POST", body: data })
      .then(function (response) { return response.json(); })
      .then(function (result) {
        if (!result.ok) { throw new Error(result.error); }
        // 3) saved: show the number and the date on the invoice
        document.getElementById("f-number").textContent =
          result.invoice_id.toLocaleString("fa-IR", { useGrouping: false });
        document.getElementById("f-date").textContent =
          new Date(result.created + "T12:00:00").toLocaleDateString("fa-IR");

        // 4) now download the PDF
        return downloadPdf(result.invoice_id);
      })
      .then(function () {
        msg.textContent = "فاکتور ذخیره و دانلود شد.";
        setTimeout(function () { location.reload(); }, 1500);
      })
      .catch(function (error) {
        msg.textContent = error.message;
        btn.disabled = false;
      });
  });
</script>
